<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }
    h2 {
      color: #333;
      margin-top: 0;
    }
    .status {
      margin: 20px 0;
      font-size: 14px;
      color: #666;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      color: #e74c3c;
      background: #fadbd8;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
    .success {
      color: #27ae60;
      background: #d5f4e6;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="title">Authenticating...</h2>
    <div id="content">
      <div class="spinner"></div>
      <div class="status">Processing your authentication request...</div>
    </div>
  </div>

  <script>
    /**
     * OAuth2 Callback Handler
     * This page handles the OAuth2 redirect from Google
     * and sends the token back to the parent window
     */

    async function handleOAuthCallback() {
      try {
        // Parse the hash fragment (implicit flow returns token in #)
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);

        const accessToken = params.get('access_token');
        const expiresIn = params.get('expires_in');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        const contentDiv = document.getElementById('content');
        const titleDiv = document.getElementById('title');

        // Handle errors
        if (error) {
          titleDiv.textContent = 'Authentication Failed';
          contentDiv.innerHTML = `
            <div class="error">
              <strong>Error:</strong> ${errorDescription || error}
            </div>
          `;

          // Send error to parent window
          if (window.opener) {
            window.opener.postMessage(
              {
                type: 'OAUTH_TOKEN',
                error: errorDescription || error,
                token: null
              },
              window.location.origin
            );
          }

          // Close after 3 seconds
          setTimeout(() => window.close(), 3000);
          return;
        }

        // Handle success
        if (!accessToken) {
          throw new Error('No access token received from Google');
        }

        const expiresAt = Date.now() + (parseInt(expiresIn || '3600') * 1000);

        titleDiv.textContent = 'Authentication Successful';
        contentDiv.innerHTML = `
          <div class="success">
            Successfully authenticated with Google
          </div>
          <div class="status">You can close this window...</div>
        `;

        // Send token to parent window
        if (window.opener) {
          window.opener.postMessage(
            {
              type: 'OAUTH_TOKEN',
              token: accessToken,
              expiresAt: expiresAt,
              error: null
            },
            window.location.origin
          );
        } else {
          // Fallback: store in sessionStorage if no opener
          sessionStorage.setItem('oauth_token', JSON.stringify({
            token: accessToken,
            expiresAt: expiresAt
          }));
        }

        // Close after 2 seconds
        setTimeout(() => window.close(), 2000);

      } catch (error) {
        console.error('OAuth callback error:', error);
        const contentDiv = document.getElementById('content');
        const titleDiv = document.getElementById('title');

        titleDiv.textContent = 'Error';
        contentDiv.innerHTML = `
          <div class="error">
            <strong>Error:</strong> ${error instanceof Error ? error.message : 'An unknown error occurred'}
          </div>
        `;

        // Send error to parent window
        if (window.opener) {
          window.opener.postMessage(
            {
              type: 'OAUTH_TOKEN',
              error: error instanceof Error ? error.message : 'Unknown error',
              token: null
            },
            window.location.origin
          );
        }

        // Close after 3 seconds
        setTimeout(() => window.close(), 3000);
      }
    }

    // Handle the callback when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', handleOAuthCallback);
    } else {
      handleOAuthCallback();
    }
  </script>
</body>
</html>
