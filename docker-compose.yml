version: '3.8'

services:
  chatbox:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: chatbox-web
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
